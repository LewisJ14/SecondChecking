name: Verify and prepare Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
        type: string
      publish:
        description: Create a new draft release after verification
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: windows-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record the commit being verified
        id: source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Cannot resolve release commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Desktop regression tests
        run: python -m unittest discover -s tests
      - name: Verify source tracking and private artifact exclusions
        run: python scripts/check_source_policy.py
      - name: Compile tracked Python
        shell: pwsh
        run: |
          $files = @(git ls-files '*.py')
          python -m py_compile @files
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed.' }

  build:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Build exact tagged source in isolated output
        shell: pwsh
        run: |
          python scripts/release_package.py build --tag $env:RELEASE_TAG --output "$env:RUNNER_TEMP/secondchecking-release"
          if ($LASTEXITCODE -ne 0) { throw 'Verified build failed.' }
      - name: Prepare and validate final release assets
        shell: pwsh
        run: |
          python scripts/release_package.py prepare --tag $env:RELEASE_TAG --output "$env:RUNNER_TEMP/secondchecking-release"
          if ($LASTEXITCODE -ne 0) { throw 'Release preparation failed.' }
      - name: Retain reviewed assets
        uses: actions/upload-artifact@v4
        with:
          name: SecondChecking-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/secondchecking-release/release/
          if-no-files-found: error
      - name: Create draft release without replacing existing assets
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_package.py publish --tag $env:RELEASE_TAG --output "$env:RUNNER_TEMP/secondchecking-release"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
