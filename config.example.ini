; Copy to config.ini beside the executable (repository root for source runs).
; Supply deployment values privately. These placeholders deliberately fail validation.
; Environment variables take precedence, including explicitly empty variables.
[database]
host = <required>
user = <required>
password = <required>
database = <required>
; Optional private CA: relative to the EXE folder (repository root for source).
; Keep this folder alongside the app when moving the deployment.
; ssl_ca = certificates/mysql-ca.pem

[webtools]
base_url = https://your-webtools-host.example.invalid
second_check_key = <required>

; Optional [search] keyword lists may be omitted: unmatched fields stay Unknown.
; Optional [hardware] ssd_thresholds uses the built-in defaults when absent.
